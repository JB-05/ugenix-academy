<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none">
  <defs>
    <filter id="featureGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="featureRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E4572E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E4572E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="140" cy="140" r="100" fill="url(#featureRadial)"/>
  <g filter="url(#featureGlow)" stroke="#E4572E" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
    <!-- Interconnected wireframe nodes -->
    <path d="M140 60 L180 90 L140 120 L100 90 Z" fill="none"/>
    <path d="M100 90 L140 120 L140 180 L100 150 Z" fill="none"/>
    <path d="M140 120 L180 90 L180 150 L140 180 Z" fill="none"/>
    <path d="M140 180 L100 150 L100 210 L140 230 Z" fill="none"/>
    <path d="M140 180 L180 150 L180 210 L140 230 Z" fill="none"/>
    <!-- Cross connections -->
    <line x1="140" y1="120" x2="140" y2="180" opacity="0.5"/>
    <line x1="100" y1="90" x2="180" y2="150" opacity="0.35"/>
    <line x1="180" y1="90" x2="100" y2="150" opacity="0.35"/>
    <line x1="120" y1="105" x2="160" y2="195" opacity="0.3"/>
    <line x1="160" y1="105" x2="120" y2="195" opacity="0.3"/>
    <!-- Nodes -->
    <circle cx="140" cy="60" r="3" fill="#C6A75E"/>
    <circle cx="180" cy="90" r="2.5" fill="#E4572E"/>
    <circle cx="100" cy="90" r="2.5" fill="#E4572E"/>
    <circle cx="140" cy="120" r="3" fill="#C6A75E"/>
    <circle cx="140" cy="180" r="3" fill="#C6A75E"/>
    <circle cx="100" cy="150" r="2" fill="#E4572E"/>
    <circle cx="180" cy="150" r="2" fill="#E4572E"/>
    <circle cx="140" cy="230" r="3" fill="#C6A75E"/>
    <circle cx="100" cy="210" r="2" fill="#E4572E"/>
    <circle cx="180" cy="210" r="2" fill="#E4572E"/>
  </g>
</svg>
